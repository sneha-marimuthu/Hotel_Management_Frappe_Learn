

<div>
    <div>
        <h2>Employee Summary</h2>
        <p> Generated on <%= dateutil.str_to_user(frappe.datetime.get_today()) %></p>

            <p>
                Age:
                <strong><%= filters.age %></strong>
            </p>
    </div>
    <table class="report-table">
        <thead>
            <tr>
                <th>Employee</th>
                <th>Age</th>
                <th>Salary</th>
            </tr>
        </thead>

        <tbody style="text-align: center;">
            <%
            for (var i = 0; i < data.length; i++) {
            %>

            <tr>
                <td width="50%">
                    <%= data[i].employee_name %>
                </td>

                <td width="30%">
                    <%= data[i].age %>
                </td>

                <td width="30%" style="text-align: right;">
                    <%= format_money(data[i].salary, "$") %>
                </td>
            </tr>

            <%
            }
            %>
        </tbody>
    </table>
</div>
