<style>
    .report-table {
        width: 100%;
        border-collapse: collapse;
    }

    .report-table th {
        background-color: #2793ff;
        color: white;
        padding: 10px;
        text-align: left;
    }

    .report-table td {
        padding: 8px;
        border: 1px solid #aa4747;
    }

    .report-table tr:nth-child(even) {
        background-color: #1f0909;
    }

    .report-table tr:hover {
        background-color: #e8f4ff;
    }
</style>


<div>
    <div>
        <h2>Employee Summary</h2>
        <p> Generated on <%= dateutil.str_to_user(frappe.datetime.get_today()) %></p>
    </div>
    <table class="report-table">
        <thead>
            <tr>
                <th>Employee</th>
                <th>Age</th>
                <th>Salary</th>
            </tr>
        </thead>

        <tbody style="text-align: center;">
            <%
            for (var i = 0; i < data.length; i++) {
            %>

            <tr>
                <td width="50%">
                    <%= data[i].employee_name %>
                </td>

                <td width="30%">
                    <%= data[i].age %>
                </td>

                <td width="30%" style="text-align: right;">
                    <%= format_money(data[i].salary, "$") %>
                </td>
            </tr>

            <%
            }
            %>
        </tbody>
    </table>
</div>
